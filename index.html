<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pour toi ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Je t'aime ❤️</h1>

        <p>Tu le sais, non ? 🥺</p>

        <h2 id="question">
            Veux-tu regarder ton film préféré avec moi ce soir ? 🎬
        </h2>

        <div class="buttons">
            <button id="oui">OUI ❤️</button>
            <button id="non">NON 😐</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
